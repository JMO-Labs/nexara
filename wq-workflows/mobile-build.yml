# @file .github/workflows/mobile-build.yml
# @brief Flutter platform builds: APK (ubuntu) and iOS no-codesign (macOS). nexara#287
name: mobile-build
on:
  pull_request: {branches: [dev], paths: ["mobile/**", "scripts/check-apk-signer.sh", ".github/workflows/mobile-build.yml"]}
  push: {branches: [dev], paths: ["mobile/**", "scripts/check-apk-signer.sh", ".github/workflows/mobile-build.yml"]}
  workflow_dispatch:
permissions: {contents: read}
defaults:
  run: {working-directory: mobile}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - id: pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "${{ steps.pin.outputs.version }}", channel: stable, cache: true}
      # Fills only uncommitted generated files; never overwrites existing ones.
      - run: flutter create . --platforms android --org dev.jmolabs --project-name nexara_mobile && git clean -fdq lib test
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter test
      - run: flutter build apk --debug
      # No key.properties/env here, so this exercises the debug-signing fallback.
      - run: flutter build apk --release
      - run: bash ../scripts/check-apk-signer.sh build/app/outputs/flutter-apk/app-release.apk "CN=Android Debug"
      # Env-signed path with a throwaway key (dummy values, not secrets).
      - run: keytool -genkeypair -keystore android/ci-test.jks -storepass ci-pass -keypass ci-pass -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname CN=ci
      - run: flutter build apk --release
        env: {NEXARA_KEYSTORE_PATH: ci-test.jks, NEXARA_KEYSTORE_PASSWORD: ci-pass, NEXARA_KEY_ALIAS: ci, NEXARA_KEY_PASSWORD: ci-pass}
      - run: bash ../scripts/check-apk-signer.sh build/app/outputs/flutter-apk/app-release.apk "CN=ci"
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < mobile/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "${{ steps.pin.outputs.version }}", channel: stable, cache: true}
      - run: flutter create . --platforms ios --org dev.jmolabs --project-name nexara_mobile && git clean -fdq lib test
      - run: flutter pub get
      - run: flutter build ios --no-codesign
      # Upload the generated Xcode project so it can be committed (no SDK in agent env).
      - uses: actions/upload-artifact@v4
        with:
          name: ios-generated
          path: |
            mobile/ios/Runner.xcodeproj
            mobile/ios/Runner.xcworkspace
            mobile/ios/Runner/Assets.xcassets
            mobile/ios/Runner/Base.lproj
            mobile/ios/RunnerTests
            mobile/ios/Flutter/AppFrameworkInfo.plist
