name: nexara_mobile
description: Nexara community platform mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_secure_storage: ^9.2.2
  firebase_messaging: ^15.0.0
  connectivity_plus: ^6.0.3
  geolocator: ^12.0.0
  image_picker: ^1.1.0
  camera: ^0.11.0
  permission_handler: ^11.3.1
  local_auth: ^2.2.0
  json_annotation: ^4.9.0
  web_socket_channel: ^3.0.0
  stream_channel: ^2.1.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
