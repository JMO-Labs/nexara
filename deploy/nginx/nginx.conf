# =============================================================================
# Nexara — Internal Nginx Configuration
# =============================================================================
#
# Nginx runs inside the app container as an internal reverse proxy.
# It serves the static frontend and proxies /api/ and /ws/ to Uvicorn.
#
# Port 8080: Application traffic (frontend + API + WebSocket)
# Port 9090: Prometheus metrics endpoint
#
# TLS is NOT handled here. Users provide their own reverse proxy
# (NPM, Caddy, Traefik, Cloudflare Tunnel) for HTTPS termination.
# =============================================================================

worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # Gzip compression for text-based assets
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;

    # DoS protection: limit upload size before Python sees the request
    client_max_body_size 520M;

    # Access log to stdout for Docker log collection
    access_log /dev/stdout;

    # ── Upstream targets ─────────────────────────────────────────────────
    upstream nexara_api  { server 127.0.0.1:8000; keepalive 32; }
    upstream nexara_next { server 127.0.0.1:3000; keepalive 32; }

    # ── Main application server (port 8080) ──────────────────────────────
    server {
        listen 8080;
        server_name _;

        # Next.js standalone server (App Router SSR + RSC + static).
        location / {
            proxy_pass http://nexara_next;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 300s;
        }

        # Long-cached, fingerprinted Next static assets.
        location /_next/static/ {
            proxy_pass http://nexara_next;
            proxy_cache_valid 200 365d;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API proxy to Uvicorn
        location /api/ {
            proxy_pass http://nexara_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Health check endpoint — direct to Uvicorn
        location = /healthz {
            proxy_pass http://nexara_api;
            proxy_set_header Host $host;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://nexara_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # SSE — disable buffering for real-time notification stream
        location /api/v1/notifications/stream {
            proxy_pass http://nexara_api;
            proxy_buffering off;
            proxy_cache     off;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }

    # ── Metrics server (port 9090) ───────────────────────────────────────
    server {
        listen 9090;
        server_name _;

        location /metrics {
            proxy_pass http://nexara_api;
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }
}
