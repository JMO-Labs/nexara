{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexara.fullname" . }}-app
  labels: {{- include "nexara.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ .Values.secrets.jwtSecret | default (randAlphaNum 48) | b64enc | quote }}
{{- end }}
{{- if or .Values.postgresql.enabled (not .Values.postgresql.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexara.fullname" . }}-db
  labels: {{- include "nexara.labels" . | nindent 4 }}
type: Opaque
data:
  database-password: {{ (ternary .Values.postgresql.password .Values.postgresql.external.password .Values.postgresql.enabled) | default (randAlphaNum 24) | b64enc | quote }}
{{- end }}
{{- if and (eq .Values.storage.backend "s3") (not .Values.storage.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexara.fullname" . }}-s3
  labels: {{- include "nexara.labels" . | nindent 4 }}
type: Opaque
data:
  s3-access-key: {{ .Values.storage.s3.accessKey | b64enc | quote }}
  s3-secret-key: {{ .Values.storage.s3.secretKey | b64enc | quote }}
{{- end }}
