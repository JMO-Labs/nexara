{{- /* Reuse existing generated values on upgrade; randomise only on first install. */ -}}
{{- define "nexara.lookupSecret" -}}
{{- $s := lookup "v1" "Secret" .root.Release.Namespace .name -}}
{{- if and $s $s.data (hasKey $s.data .key) -}}{{- index $s.data .key | b64dec -}}{{- end -}}
{{- end -}}
{{- if not .Values.secrets.existingSecret }}
{{- $appName := printf "%s-app" (include "nexara.fullname" .) }}
{{- $jwt := .Values.secrets.jwtSecret | default (include "nexara.lookupSecret" (dict "root" . "name" $appName "key" "secret-key")) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appName }}
  labels: {{- include "nexara.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ $jwt | b64enc | quote }}
{{- end }}
{{- if or .Values.postgresql.enabled (not .Values.postgresql.external.existingSecret) }}
{{- $dbName := printf "%s-db" (include "nexara.fullname" .) }}
{{- $pw := (ternary .Values.postgresql.password .Values.postgresql.external.password .Values.postgresql.enabled) | default (include "nexara.lookupSecret" (dict "root" . "name" $dbName "key" "database-password")) | default (randAlphaNum 24) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  labels: {{- include "nexara.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  database-password: {{ $pw | b64enc | quote }}
{{- end }}
{{- if and (eq .Values.storage.backend "s3") (not .Values.storage.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexara.fullname" . }}-s3
  labels: {{- include "nexara.labels" . | nindent 4 }}
type: Opaque
data:
  s3-access-key: {{ .Values.storage.s3.accessKey | b64enc | quote }}
  s3-secret-key: {{ .Values.storage.s3.secretKey | b64enc | quote }}
{{- end }}
