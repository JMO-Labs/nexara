apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexara.fullname" . }}
  labels: {{- include "nexara.labels" . | nindent 4 }}
data:
  STORAGE_BACKEND: {{ .Values.storage.backend | quote }}
  LOCAL_STORAGE_PATH: "/data/media"
  S3_ENDPOINT_URL: {{ .Values.storage.s3.endpointUrl | quote }}
  S3_BUCKET: {{ .Values.storage.s3.bucket | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
