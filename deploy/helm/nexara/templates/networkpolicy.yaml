{{- /* Egress shared by API, worker and beat: DNS, data stores, external APIs */ -}}
{{- define "nexara.egress" }}
- ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- if .Values.postgresql.enabled }}
- to:
    - podSelector:
        matchLabels: {{- include "nexara.selector" (dict "root" . "component" "postgresql") | nindent 10 }}
  ports: [{port: 5432}]
{{- else }}
- ports: [{port: {{ .Values.postgresql.external.port }}}]
{{- end }}
{{- if .Values.valkey.enabled }}
- to:
    - podSelector:
        matchLabels: {{- include "nexara.selector" (dict "root" . "component" "valkey") | nindent 10 }}
  ports: [{port: 6379}]
{{- else }}
- ports: [{port: 6379}]
{{- end }}
- to: [{ipBlock: {cidr: 0.0.0.0/0}}]
  ports:
  {{- range .Values.networkPolicy.externalEgressPorts }}
    - {port: {{ . }}}
  {{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $apps := list "api" "worker" "beat" }}
{{- range $name := $apps }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexara.fullname" $ }}-{{ $name }}
  labels: {{- include "nexara.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "nexara.selector" (dict "root" $ "component" $name) | nindent 6 }}
  policyTypes: [{{ if eq $name "api" }}Ingress, {{ end }}Egress]
  {{- if eq $name "api" }}
  ingress:
    - ports: [{port: {{ $.Values.api.port }}}]
      {{- with $np.apiIngressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if $.Values.pluginHost.enabled }}
    - from:
        - podSelector:
            matchLabels: {{- include "nexara.selector" (dict "root" $ "component" "plugin-host") | nindent 14 }}
      ports: [{port: {{ $.Values.api.port }}}]
    {{- end }}
  {{- end }}
  egress: {{- include "nexara.egress" $ | indent 4 }}
  {{- if and $.Values.pluginHost.enabled (ne $name "beat") }}
    - to:
        - podSelector:
            matchLabels: {{- include "nexara.selector" (dict "root" $ "component" "plugin-host") | nindent 14 }}
      ports: [{port: {{ $.Values.pluginHost.port }}}]
  {{- end }}
{{- end }}
{{- range $name, $port := dict "postgresql" 5432 "valkey" 6379 }}
{{- if index $.Values $name "enabled" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexara.fullname" $ }}-{{ $name }}
  labels: {{- include "nexara.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "nexara.selector" (dict "root" $ "component" $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $apps }}
        - podSelector:
            matchLabels: {{- include "nexara.selector" (dict "root" $ "component" .) | nindent 14 }}
        {{- end }}
      ports: [{port: {{ $port }}}]
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.pluginHost.enabled }}
{{- /* Plugin host: only api/worker may call it; it may reach DNS, the API and
       the internet, but not private ranges (Postgres/Valkey live there). */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexara.fullname" . }}-plugin-host
  labels: {{- include "nexara.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "nexara.selector" (dict "root" . "component" "plugin-host") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range list "api" "worker" }}
        - podSelector:
            matchLabels: {{- include "nexara.selector" (dict "root" $ "component" .) | nindent 14 }}
        {{- end }}
      ports: [{port: {{ .Values.pluginHost.port }}}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.pluginHost.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml .Values.pluginHost.dns.podLabels | nindent 14 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {{- include "nexara.selector" (dict "root" . "component" "api") | nindent 14 }}
      ports: [{port: {{ .Values.api.port }}}]
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml .Values.networkPolicy.privateCidrs | nindent 14 }}
      ports:
      {{- range .Values.pluginHost.egressPorts }}
        - {port: {{ . }}}
      {{- end }}
    - to:
        - ipBlock:
            cidr: ::/0
            except: {{- toYaml .Values.networkPolicy.privateCidrs6 | nindent 14 }}
      ports:
      {{- range .Values.pluginHost.egressPorts }}
        - {port: {{ . }}}
      {{- end }}
{{- end }}
