{{- if .Values.valkey.enabled }}
{{- $ctx := dict "root" . "component" "valkey" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexara.fullname" . }}-valkey
  labels: {{- include "nexara.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "nexara.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nexara.selector" $ctx | nindent 8 }}
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image | quote }}
          args: ["--appendonly", "yes"]
          ports: [{name: redis, containerPort: 6379}]
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          {{- if .Values.valkey.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "nexara.fullname" . }}-valkey}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexara.fullname" . }}-valkey
  labels: {{- include "nexara.labels" . | nindent 4 }}
spec:
  selector: {{- include "nexara.selector" $ctx | nindent 4 }}
  ports: [{name: redis, port: 6379, targetPort: redis}]
{{- if .Values.valkey.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexara.fullname" . }}-valkey
  labels: {{- include "nexara.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.valkey.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.valkey.persistence.size }}
{{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- $ctx := dict "root" . "component" "postgresql" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexara.fullname" . }}-postgresql
  labels: {{- include "nexara.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "nexara.fullname" . }}-postgresql-headless
  selector:
    matchLabels: {{- include "nexara.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nexara.selector" $ctx | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "nexara.dbSecret" . }}, key: database-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]}
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "nexara.fullname" . }}-postgresql}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexara.fullname" . }}-postgresql-headless
  labels: {{- include "nexara.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "nexara.selector" $ctx | nindent 4 }}
  ports: [{name: pg, port: 5432, targetPort: pg}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexara.fullname" . }}-postgresql
  labels: {{- include "nexara.labels" . | nindent 4 }}
spec:
  selector: {{- include "nexara.selector" $ctx | nindent 4 }}
  ports: [{name: pg, port: 5432, targetPort: pg}]
{{- if .Values.postgresql.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexara.fullname" . }}-postgresql
  labels: {{- include "nexara.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
{{- end }}
