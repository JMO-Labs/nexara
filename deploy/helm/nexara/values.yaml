# Nexara Helm values. See README.md for details and examples.

# -- Container image (single image runs API, worker and beat)
image:
  registry: ghcr.io
  repository: com-nexara/nexara
  tag: ""            # defaults to Chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- API deployment (nginx + uvicorn on port 8080)
api:
  replicas: 3
  port: 8080
  # nginx + supervisord write outside /tmp, so the API root FS stays writable.
  readOnlyRootFilesystem: false
  # API entrypoint is supervisord+nginx as root (pid/temp outside /tmp), so it cannot
  # use the non-root context above; only restrict what root-run processes don't need.
  podSecurityContext:
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  # Soft pod anti-affinity spreads replicas across nodes.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: nexara
                app.kubernetes.io/component: api

# -- Celery worker
worker:
  replicas: 2
  queues: default,maintenance,email,notifications,media
  concurrency: 4
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

# -- Celery beat (singleton, replicas must stay 1)
beat:
  # replicas is fixed at 1 by the template
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}

# -- Valkey (Redis-compatible cache/broker)
valkey:
  enabled: true
  image: valkey/valkey:8-alpine
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  # Used when enabled=false, e.g. redis://my-redis:6379
  external:
    url: ""

# -- PostgreSQL
postgresql:
  enabled: true
  image: postgres:18-alpine
  database: nexara
  username: nexara
  password: ""       # generated if empty
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  # Used when enabled=false
  external:
    host: ""
    port: 5432
    database: nexara
    username: nexara
    password: ""     # or set existingSecret
    existingSecret: ""   # secret containing key "database-password"

# -- Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nexara.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: nexara-tls
  #    hosts: [nexara.example.com]

# -- Horizontal Pod Autoscaler for the API
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilization: 70
  # Celery workers scale on CPU (queue-depth metrics need an external adapter).
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilization: 70

# -- PodDisruptionBudgets for API and workers
pdb:
  enabled: true
  minAvailable: 1

# -- NetworkPolicies (needs a CNI that enforces them)
networkPolicy:
  enabled: false
  # Peers allowed to reach the API; empty = any source (ingress controller).
  apiIngressFrom: []
  # Ports pods may reach outside the cluster (SMTP, HTTPS APIs, S3, push).
  externalEgressPorts: [443, 587, 465]

# -- Pod/container security for worker/beat (data stores keep image defaults)
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 1001   # matches `nexara` user in deploy/docker/nexara.Dockerfile
    runAsGroup: 1001
    fsGroup: 1001
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}

# -- Secrets (generated on first install when empty; reused on upgrade and kept on uninstall)
secrets:
  existingSecret: ""   # secret with keys "secret-key" (JWT/signing); overrides below
  jwtSecret: ""

# -- Application environment variables
env:
  COMMUNITY_DEFAULT: "default"
  LOG_LEVEL: "INFO"
  ENABLE_REGISTRATION: "true"
  REQUIRE_INVITE: "false"
  ALLOWED_ORIGINS: ""

# -- Media storage: "local" (PVC) or "s3"
storage:
  backend: local
  local:
    size: 20Gi
    storageClass: ""
    # -- Must be ReadWriteMany when API/worker pods run on several nodes
    accessModes: [ReadWriteMany]
  s3:
    endpointUrl: ""
    bucket: nexara
    accessKey: ""
    secretKey: ""
    existingSecret: ""   # keys "s3-access-key" and "s3-secret-key"
