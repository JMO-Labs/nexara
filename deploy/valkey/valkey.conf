# =============================================================================
# Valkey Configuration — Nexara Community Platform
# =============================================================================
#
# Valkey runs inside the app container, managed by supervisord.
# Three logical databases provide isolation:
#   DB 0 — Celery broker (noeviction: tasks must not be lost)
#   DB 1 — Pub/Sub (real-time delivery; no persistence needed)
#   DB 2 — Application cache (allkeys-lru; rebuildable from Postgres)
#
# This file is mounted into the container at /etc/valkey/valkey.conf.
# =============================================================================

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
bind 127.0.0.1
port 6379
protected-mode yes

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------------------------------------------------------------------------
# Persistence — disabled; all Valkey data is ephemeral
# ---------------------------------------------------------------------------
save ""
appendonly no

# ---------------------------------------------------------------------------
# Logging — stdout for Docker log aggregation
# ---------------------------------------------------------------------------
loglevel notice
logfile ""

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
databases 3
tcp-backlog 511
timeout 0
tcp-keepalive 300
