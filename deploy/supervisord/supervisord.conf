; =============================================================================
; Nexara — Supervisord Main Configuration
; =============================================================================
;
; Manages all processes inside the nexara app container:
;   valkey (priority 10) → nginx (20) → uvicorn (30) →
;   celery-worker (40) → celery-beat (50)
;
; All logs go to stdout/stderr for Docker log aggregation.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor.d/*.conf
