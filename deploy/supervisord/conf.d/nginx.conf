; Nginx — internal reverse proxy for frontend + API.
; Priority 20: starts after Valkey, before Uvicorn.

[program:nginx]
command=nginx -g "daemon off;"
user=root
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
