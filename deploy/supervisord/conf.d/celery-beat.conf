; Celery Beat — periodic task scheduler.
; Priority 50: starts last; depends on the worker being available.

[program:celery-beat]
command=/usr/local/bin/celery -A app.tasks.celery_app beat -l info --schedule /tmp/celerybeat-schedule
directory=/app
user=nexara
priority=50
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
