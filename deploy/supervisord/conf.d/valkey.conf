; Valkey (Redis-compatible) — embedded in the app container.
; Priority 10: starts first so broker/cache is available for other services.

[program:valkey]
command=valkey-server /etc/valkey/valkey.conf
user=nexara
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
