; Celery worker — processes background tasks (email, notifications, media).
; Priority 40: starts after Uvicorn.

[program:celery-worker]
command=/usr/local/bin/celery -A app.tasks.celery_app worker -Q default,email,notifications,media -c 4 -l info
directory=/app
user=nexara
priority=40
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
