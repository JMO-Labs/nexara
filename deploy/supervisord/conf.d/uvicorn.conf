; Uvicorn — FastAPI application server.
; Priority 30: starts after Nginx so the proxy target is ready.

[program:uvicorn]
command=/usr/local/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2
directory=/app
user=nexara
priority=30
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
