##
# @file .gitlab/ci/test-mobile.yml
# @brief Flutter analyze and unit tests for the mobile app.
##

# Static pipeline checks: Flutter pin parity, signing, Fastlane, docs (nexara#363).
lint:mobile-ci:
  stage: lint
  image: ubuntu:24.04
  rules:
    - changes:
        - mobile/**/*
        - scripts/test-mobile-ci.sh
        - scripts/wq-ci-test.sh
        - .gitlab/ci/*.yml
        - wq-workflows/*
  script:
    - bash scripts/test-mobile-ci.sh

test:mobile:
  stage: test
  image: ghcr.io/cirruslabs/flutter:$FLUTTER_VERSION
  rules:
    - changes:
        - mobile/**/*
        - .gitlab/ci/test-mobile.yml
  script:
    - cd mobile
    - flutter pub get
    - dart format --output=none --set-exit-if-changed .
    - flutter analyze
    - flutter test

# Android release build (nexara#287). `flutter create` only fills in
# generated files that are not committed (gradle wrapper, Xcode project);
# it never overwrites existing ones. Stray template files in lib/ and test/ are removed.
build:mobile-apk:
  stage: test
  image: ghcr.io/cirruslabs/flutter:$FLUTTER_VERSION
  rules:
    - changes:
        - mobile/**/*
        - .gitlab/ci/test-mobile.yml
  script:
    - cd mobile
    - flutter create . --platforms android --org dev.jmolabs --project-name nexara_mobile
    - git clean -fdq lib test
    - flutter pub get
    - flutter build apk --debug
    # No signing env present: exercises the debug-signing fallback.
    - flutter build apk --release
  artifacts:
    paths:
      - mobile/build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week

# Signed release AAB: tag-only, protected refs only. Secrets are CI variables
# (protected + masked); see mobile/README.md for names.
build:mobile-aab:
  stage: build
  image: ghcr.io/cirruslabs/flutter:$FLUTTER_VERSION
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    # All four must be set, else gradle silently falls back to the debug key.
    - |
      for v in NEXARA_KEYSTORE_BASE64 NEXARA_KEYSTORE_PASSWORD NEXARA_KEY_ALIAS NEXARA_KEY_PASSWORD; do
        [ -n "$(printenv "$v")" ] || { echo "$v not set"; exit 1; }
      done
    - cd mobile
    - flutter create . --platforms android --org dev.jmolabs --project-name nexara_mobile
    - git clean -fdq lib test
    - flutter pub get
    - echo "$NEXARA_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
    - export NEXARA_KEYSTORE_PATH=upload-keystore.jks
    - flutter build appbundle --release
  after_script:
    - rm -f mobile/android/upload-keystore.jks
  artifacts:
    paths:
      - mobile/build/app/outputs/bundle/release/app-release.aab
    expire_in: 30 days

.fastlane:
  stage: release
  image: ruby:3.3
  needs: ["build:mobile-aab"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true

fastlane:android-beta:
  extends: .fastlane
  script:
    - cd mobile
    - gem install fastlane --no-document
    - fastlane android beta

# iOS needs a macOS runner (tag via IOS_RUNNER_TAG at project level).
fastlane:ios-beta:
  extends: .fastlane
  image: null
  needs: []
  tags: [macos]
  script:
    - cd mobile
    - fastlane ios beta
