##
# @file .gitlab/ci/lint-backend.yml
# @brief Backend linting jobs: Ruff (lint + format) and mypy (type checking).
#
# Lint jobs use .rules:backend-lint which runs on MR pipelines (with
# change detection), the default branch, tags, AND feature branch
# pushes -- catching issues before an MR is created.
##

lint:ruff:
  stage: lint
  image: python:3.12-alpine
  before_script:
    - pip install --quiet ruff
  script:
    - echo "Running Ruff linter..."
    - ruff check backend/
    - echo "Checking Ruff formatting..."
    - ruff format --check backend/
  rules: !reference [.rules:backend-lint, rules]
  allow_failure: false

lint:mypy:
  stage: lint
  image: $PYTHON_IMAGE
  extends:
    - .cache:python
  needs:
    - job: lint:ruff
      optional: true
  before_script:
    - pip install --quiet uv
    - cd backend
    - uv venv .venv --clear
    - uv sync --frozen --extra dev 2>/dev/null || uv sync --extra dev
  script:
    - echo "Running mypy type checking..."
    - .venv/bin/mypy app/ --ignore-missing-imports
  rules: !reference [.rules:backend-lint, rules]
  allow_failure: true
