##
# @file .gitlab/ci/test-backend.yml
# @brief Backend test job with PostgreSQL service and coverage reporting.
#
# Runs pytest against a real PostgreSQL 16 instance (no SQLite).
# Produces HTML coverage for Pages, Cobertura XML for MR diffs,
# and terminal output for GitLab's built-in coverage parsing.
##

test:backend:
  stage: test
  image: $PYTHON_IMAGE
  extends:
    - .cache:python-rw
  needs:
    - job: lint:ruff
      optional: true
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: $POSTGRES_DB
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_HOST_AUTH_METHOD: $POSTGRES_HOST_AUTH_METHOD
  variables:
    DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  before_script:
    - apk add --no-cache gcc musl-dev libffi-dev postgresql16-client
    - pip install --quiet uv
    - cd backend
    - uv venv .venv
    - uv sync --frozen 2>/dev/null || uv sync
    - source .venv/bin/activate
    - cd "$CI_PROJECT_DIR"
    - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done
  script:
    - cd backend
    - >-
      pytest
      --cov=app
      --cov-report=term
      --cov-report=html:htmlcov
      --cov-report=xml:coverage.xml
      --junitxml=report.xml
      -v
  coverage: '/(?i)TOTAL.*?(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - backend/htmlcov/
      - backend/coverage.xml
      - backend/report.xml
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 30 days
  rules: !reference [.rules:backend-changes, rules]
