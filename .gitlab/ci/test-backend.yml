##
# @file .gitlab/ci/test-backend.yml
# @brief Backend test jobs: unit tests (no services) and integration tests (PostgreSQL).
#
# Unit tests run without any external services.
# Integration tests run against a real PostgreSQL 16 instance.
# Both produce coverage and JUnit reports.
##

test:backend:unit:
  stage: test
  image: $PYTHON_IMAGE
  extends:
    - .cache:python-rw
  needs:
    - job: lint:ruff
      optional: true
  before_script:
    - pip install --quiet uv
    - cd backend
    - uv venv .venv
    - uv sync --frozen --extra dev 2>/dev/null || uv sync --extra dev
  script:
    - >-
      .venv/bin/pytest tests/unit/
      --cov=app
      --cov-report=term
      --cov-report=html:htmlcov
      --cov-report=xml:coverage.xml
      --junitxml=report.xml
      -v
  coverage: '/(?i)TOTAL.*?(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - backend/htmlcov/
      - backend/coverage.xml
      - backend/report.xml
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 30 days
  rules: !reference [.rules:backend-changes, rules]

test:backend:integration:
  stage: test
  image: $PYTHON_IMAGE
  extends:
    - .cache:python
  needs:
    - job: test:backend:unit
      optional: true
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: $POSTGRES_DB
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_HOST_AUTH_METHOD: $POSTGRES_HOST_AUTH_METHOD
  variables:
    DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  before_script:
    - apk add --no-cache gcc musl-dev libffi-dev postgresql16-client
    - pip install --quiet uv
    - cd backend
    - uv venv .venv --clear
    - uv sync --frozen --extra dev 2>/dev/null || uv sync --extra dev
    - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done
  script:
    - >-
      .venv/bin/pytest tests/integration/
      --junitxml=report-integration.xml
      -v
  artifacts:
    when: always
    paths:
      - backend/report-integration.xml
    reports:
      junit: backend/report-integration.xml
    expire_in: 30 days
  rules: !reference [.rules:backend-changes, rules]
  allow_failure: true
