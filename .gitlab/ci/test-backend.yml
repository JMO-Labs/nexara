##
# @file .gitlab/ci/test-backend.yml
# @brief Backend test jobs: unit tests (no services) and integration tests (PostgreSQL).
#
# Unit tests run without any external services.
# Integration tests run against a real PostgreSQL 16 instance.
# Both produce coverage and JUnit reports.
##

test:backend:unit:
  stage: test
  image: $PYTHON_IMAGE
  extends:
    - .cache:python-rw
  needs:
    - job: lint:ruff
      optional: true
  before_script:
    - pip install --quiet uv
    - cd backend
    - uv venv .venv --clear
    - uv sync --frozen --extra dev 2>/dev/null || uv sync --extra dev
  script:
    - >-
      .venv/bin/pytest tests/unit/
      --cov=app
      --cov-report=term
      --cov-report=html:htmlcov
      --cov-report=xml:coverage.xml
      --junitxml=report.xml
      -v
  coverage: '/(?i)TOTAL.*?(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - backend/htmlcov/
      - backend/coverage.xml
      - backend/report.xml
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 30 days
  rules: !reference [.rules:backend-changes, rules]

test:backend:integration:
  stage: test
  image: docker:27
  extends:
    - .cache:python
  needs:
    - job: test:backend:unit
      optional: true
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@docker:5432/${POSTGRES_DB}"
    REDIS_URL: "redis://docker:6379"
  before_script:
    - apk add --no-cache python3 py3-pip gcc musl-dev libffi-dev postgresql16-client
    - pip install --quiet uv --break-system-packages
    - docker run -d
      --name postgres
      -e POSTGRES_DB="$POSTGRES_DB"
      -e POSTGRES_USER="$POSTGRES_USER"
      -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
      -e POSTGRES_HOST_AUTH_METHOD=trust
      -p 5432:5432
      postgres:16-alpine
    - docker run -d
      --name valkey
      -p 6379:6379
      valkey/valkey:8-alpine
    - cd backend
    - uv venv .venv --clear
    - uv sync --frozen --extra dev 2>/dev/null || uv sync --extra dev
    - |
      TRIES=0; MAX_TRIES=30
      until pg_isready -h docker -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
        TRIES=$((TRIES + 1))
        if [ "$TRIES" -ge "$MAX_TRIES" ]; then
          echo "PostgreSQL not available after ${MAX_TRIES}s — aborting"
          exit 1
        fi
        sleep 1
      done
    - |
      echo "Running Alembic migrations..."
      DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@docker:5432/${POSTGRES_DB}" \
        .venv/bin/alembic upgrade head
  script:
    - >-
      .venv/bin/pytest tests/integration/
      --junitxml=report-integration.xml
      -v
  after_script:
    - docker rm -f postgres valkey || true
  artifacts:
    when: always
    paths:
      - backend/report-integration.xml
    reports:
      junit: backend/report-integration.xml
    expire_in: 30 days
  rules: !reference [.rules:backend-changes, rules]
  allow_failure: true
