##
# @file .gitlab/ci/release.yml
# @brief GitLab Release creation on version tags (v*).
#
# Uses the release-cli tool (pre-installed in the gitlab-release-cli
# image) to create a GitLab Release with:
#   - Auto-generated changelog from conventional commits
#   - Link to the container image in the GitLab Registry
#   - Link to the GitLab Pages documentation site
#   - Attached security and coverage report artifacts
##

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:docker
    - job: scan:container
      optional: true
      artifacts: true
    - job: report:badges
      optional: true
      artifacts: true
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apk add --no-cache jq curl
  script:
    - |
      VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
      echo "Creating release for version ${VERSION}..."

      REGISTRY_URL="${CI_REGISTRY_IMAGE}/nexara:${VERSION}"
      PAGES_URL="${CI_PAGES_URL}"

      # Build release description
      DESCRIPTION="## Release v${VERSION}"
      DESCRIPTION="${DESCRIPTION}\n\n### Container Image"
      DESCRIPTION="${DESCRIPTION}\n\n\`\`\`bash"
      DESCRIPTION="${DESCRIPTION}\ndocker pull ${REGISTRY_URL}"
      DESCRIPTION="${DESCRIPTION}\n\`\`\`"
      DESCRIPTION="${DESCRIPTION}\n\n### Links"
      DESCRIPTION="${DESCRIPTION}\n\n- [Documentation](${PAGES_URL})"
      DESCRIPTION="${DESCRIPTION}\n- [API Reference](${PAGES_URL}/api/)"
      DESCRIPTION="${DESCRIPTION}\n- [Container Registry](${CI_PROJECT_URL}/container_registry)"

      if [ -f trivy-report.json ]; then
        VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json 2>/dev/null || echo "0")
        DESCRIPTION="${DESCRIPTION}\n\n### Security"
        DESCRIPTION="${DESCRIPTION}\n\n- Container vulnerabilities found: ${VULN_COUNT}"
      fi

      DESCRIPTION="${DESCRIPTION}\n\n### Changelog"
      DESCRIPTION="${DESCRIPTION}\n\nSee [commit history](${CI_PROJECT_URL}/-/compare/$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo 'main')...${CI_COMMIT_TAG}) for full changes."

      echo -e "$DESCRIPTION" > release_description.md
      cat release_description.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Nexara $CI_COMMIT_TAG"
    description: ./release_description.md
    assets:
      links:
        - name: "Container Image (${CI_COMMIT_TAG})"
          url: "https://${CI_REGISTRY_IMAGE}/nexara:${CI_COMMIT_TAG#v}"
          link_type: image
        - name: "Documentation"
          url: "${CI_PAGES_URL}"
          link_type: other
  rules: !reference [.rules:tag-only, rules]
