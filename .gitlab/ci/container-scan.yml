##
# @file .gitlab/ci/container-scan.yml
# @brief Trivy container vulnerability scanning on built Docker images.
#
# Scans the image pushed by the build:docker job for known CVEs.
# Produces a JSON report artifact and fails on CRITICAL severity
# (configurable via TRIVY_SEVERITY). Set to allow_failure initially
# while establishing the vulnerability baseline.
##

scan:container:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs:
    - job: build:docker
  variables:
    TRIVY_SEVERITY: "CRITICAL,HIGH"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
  before_script:
    - export TRIVY_USERNAME="${CI_REGISTRY_USER}"
    - export TRIVY_PASSWORD="${CI_REGISTRY_PASSWORD}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        SCAN_TAG=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
      else
        SCAN_TAG="main"
      fi
      export FULL_IMAGE="${NEXARA_IMAGE}:${SCAN_TAG}"
      echo "Scanning image: ${FULL_IMAGE}"
  script:
    - echo "Running Trivy vulnerability scan..."
    - >-
      trivy image
      --severity "$TRIVY_SEVERITY"
      --format json
      --output trivy-report.json
      "$FULL_IMAGE"
    - echo "--- Trivy Summary ---"
    - >-
      trivy image
      --severity "$TRIVY_SEVERITY"
      --format table
      "$FULL_IMAGE"
    - echo "Trivy scan complete. Report saved to trivy-report.json"
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 30 days
  cache:
    key: "trivy-db"
    paths:
      - "$CI_PROJECT_DIR/.cache/trivy"
    policy: pull-push
  rules: !reference [.rules:default-branch-and-tag, rules]
  allow_failure: true
