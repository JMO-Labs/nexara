##
# @file .gitlab/ci/build.yml
# @brief Docker image build and push via Kaniko.
#
# Kaniko runs in userspace (no Docker-in-Docker, no privileged mode)
# and is the recommended builder for GitLab.com shared runners.
#
# Tagging strategy:
#   - Default branch push:  :main, :$CI_COMMIT_SHORT_SHA
#   - Version tag (v*):     :latest, :$VERSION, :$CI_COMMIT_SHORT_SHA
##

build:docker:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  needs:
    - job: test:backend:unit
      optional: true
    - job: test:frontend
      optional: true
    - job: security:bandit
      optional: true
    - job: security:pip-audit
      optional: true
    - job: security:npm-audit
      optional: true
    - job: security:gitleaks
      optional: true
  variables:
    DOCKERFILE_PATH: "deploy/docker/nexara.Dockerfile"
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}"
      > /kaniko/.docker/config.json
  script:
    - |
      DESTINATIONS=""

      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
        DESTINATIONS="--destination=${NEXARA_IMAGE}:latest"
        DESTINATIONS="${DESTINATIONS} --destination=${NEXARA_IMAGE}:${VERSION}"
        DESTINATIONS="${DESTINATIONS} --destination=${NEXARA_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      else
        DESTINATIONS="--destination=${NEXARA_IMAGE}:main"
        DESTINATIONS="${DESTINATIONS} --destination=${NEXARA_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      fi

      echo "Building image with destinations: ${DESTINATIONS}"

      /kaniko/executor \
        --context="${CI_PROJECT_DIR}" \
        --dockerfile="${CI_PROJECT_DIR}/${DOCKERFILE_PATH}" \
        --cache=true \
        --cache-repo="${CI_REGISTRY_IMAGE}/cache" \
        --snapshot-mode=redo \
        --compressed-caching=false \
        ${DESTINATIONS}
  rules: !reference [.rules:default-branch-and-tag, rules]
