##
# @file docs/mkdocs.yml
# @brief MkDocs Material configuration for Nexara project documentation.
#
# Generates a static documentation site deployed to GitLab Pages.
# The site includes project docs, links to API reference (Doxygen),
# and coverage/test reports hosted alongside the docs.
##

site_name: Nexara Documentation
site_description: >-
  An open-source, self-hosted community platform for families, clubs,
  and small groups. Documentation for developers and self-hosters.
site_url: ""
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - awesome-pages
