<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ community_name }}{% endblock %}</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 24px; }
    .header { padding-bottom: 24px; border-bottom: 1px solid #eee; }
    .header a { color: {{ color_primary }}; text-decoration: none; font-weight: 600; }
    .content { padding: 24px 0; }
    .footer { padding-top: 24px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    .footer a { color: {{ color_primary }}; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      {% if logo_url %}
      <img src="{{ logo_url }}" alt="{{ community_name }}" height="32">
      {% else %}
      <a href="{{ app_url | default('#') }}">{{ community_name }}</a>
      {% endif %}
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      {% block footer %}
      {% if footer_text %}
      <p>{{ footer_text }}</p>
      {% else %}
      <p>You received this email because you have an account on {{ community_name }}.</p>
      {% endif %}
      {% endblock %}
    </div>
  </div>
</body>
</html>
