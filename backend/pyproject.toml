[project]
name = "nexara-backend"
version = "0.1.0"
description = "Nexara community platform - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Configuration
    "pydantic-settings>=2.7.0",
    # Cache / Pub-Sub (Valkey via redis protocol)
    "redis[hiredis]>=5.2.0",
    # Storage
    "aiofiles>=24.1.0",
    "aioboto3>=13.3.0",
    # Task queue
    "celery[redis]>=5.4.0",
    # Logging
    "structlog>=24.4.0",
    # Image processing
    "pillow>=11.0.0",
    # HTTP client
    "httpx>=0.28.0",
    "authlib>=1.3.0",
    # i18n
    "babel>=2.16.0",
    # Auth / Security
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Prometheus metrics
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Beat advisory lock (sync Postgres driver)
    "psycopg2-binary>=2.9.10",
    "pyotp>=2.9.0",
    "email-validator>=2.3.0",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "packaging>=24.0",
    "pywebpush>=2.3.0",
    # Calendar / events
    "python-dateutil>=2.9.0",
    "icalendar>=6.0.0",
    "types-python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["../plugins"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
