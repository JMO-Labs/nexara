name: security-scan
on:
  pull_request:
  push: {branches: [dev, main]}
  workflow_run: {workflows: [build], types: [completed]}
permissions: {contents: read, security-events: write, packages: read}
jobs:
  gitleaks:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  trivy:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - id: tag
        run: echo "sha=sha-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/jmo-labs/nexara:${{ steps.tag.outputs.sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy.sarif
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-nexara
          sha: ${{ github.event.workflow_run.head_sha }}
          ref: refs/heads/${{ github.event.workflow_run.head_branch }}
